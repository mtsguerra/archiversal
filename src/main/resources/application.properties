spring.application.name=archiversal

# Framework errors (400, 405, ...) use the same problem+json format as ApiExceptionHandler.
spring.mvc.problemdetails.enabled=true

server.port=8090

# Errors never carry internals: no stack traces, exception names or messages in a response.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
